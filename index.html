<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seun B | Tech & Business Hybrid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #f5f7fa;
      --text: #1a1a1a;
      --accent: #1d4ed8;
      --card: white;
      --gold: #d4af37;
      --dark-grey: #2e2e2e;
    }
    body.dark {
      --bg: #1e1e1e;
      --text: #eeeeee;
      --accent: #60a5fa;
      --card: #2c2c2c;
      --gold: #ffd700;
      --dark-grey: #444;
    }
    * {
      transition: background 0.3s, color 0.3s;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      animation: fadeIn 1s ease-in;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header {
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 60px 20px 40px;
      position: relative;
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .initials {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background-color: var(--dark-grey);
      color: var(--gold);
      font-weight: bold;
      font-size: 3em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      animation: popIn 1s ease-in-out;
      animation-delay: 0.3s;
      animation-fill-mode: forwards;
      animation-play-state: running;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 2.5em;
      width: 0ch;
      overflow: hidden;
      white-space: nowrap;
      margin: 0 auto 10px auto;
      animation: typing 3.5s steps(20, end) forwards;
    }
    @keyframes typing {
      to {
        width: 20ch;
      }
    }
    p {
      font-size: 1.1em;
      max-width: 700px;
      margin: 10px auto 0 auto;
    }
    section {
      padding: 40px 20px;
      text-align: center;
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      background: #153db1;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .social-icons a {
      font-size: 1.5em;
      margin: 0 10px;
      color: var(--accent);
      transition: transform 0.3s;
    }
    .social-icons a:hover {
      transform: scale(1.2);
    }
    .toggle-mode {
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      font-size: 1.2em;
      background: var(--card);
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      color: var(--text);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
    }
    footer {
      padding: 20px;
      text-align: center;
      font-size: 0.9em;
      background: var(--card);
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
      margin-top: auto;
      border-radius: 0 0 12px 12px;
    }
    .button-group {
      margin-top: 20px;
    }
    .button-group .btn {
      margin: 10px 10px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
        animation: typing 3.5s steps(20, end) forwards;
        max-width: 90vw;
      }
      .initials {
        width: 90px;
        height: 90px;
        font-size: 2.2em;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
      }
      p {
        font-size: 1em;
        padding: 0 10px;
      }
      .btn {
        padding: 10px 18px;
        font-size: 0.9em;
        margin: 8px 6px;
      }
      .social-icons a {
        font-size: 1.3em;
        margin: 0 8px;
      }
      footer {
        font-size: 0.8em;
      }
      .toggle-mode {
        padding: 8px 12px;
        font-size: 1em;
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>

<button class="toggle-mode" onclick="toggleDarkMode()" aria-label="Toggle Dark Mode">
  🌙 Toggle Dark Mode
</button>

<header>
  <div class="initials">SB</div>
  <h1>Hi, I'm Seun Balogun</h1>
  <p>Linux and AIX Support Personnel · Helpdesk Support with O365 · Storage Admin · DevOps and Business Analyst</p>
</header>

<section>
  <div class="button-group">
    <a class="btn" href="mailto:seun@seunb.com">Contact Me</a>
    <a class="btn" href="https://resume.seunb.com" target="_blank" rel="noopener noreferrer">View Resume</a>
    <a class="btn" href="https://devblog.seunb.com" target="_blank" rel="noopener noreferrer">My Blog</a>
    <a class="btn" href="https://pizza.seunb.com" target="_blank" rel="noopener noreferrer">Order Pizza Demo</a>
  </div>

  <div class="social-icons" style="margin-top: 30px;">
    <a href="https://linkedin.com/in/seun-ob" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://github.com/balogsun" aria-label="GitHub"><i class="fab fa-github"></i></a>
    <a href="https://x.com/balogsen" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
    <a href="https://www.facebook.com/balogun.olaoluseun/" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
  </div>
</section>

<footer>
  &copy; 2025 Seun B. All rights reserved.
</footer>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle("dark");
  }
</script>

</body>
</html>
